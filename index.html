<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAWI DIGITAL AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d19;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #101a30;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #263b60;
}

header h1 {
  color: #36a9ff;
  margin: 0;
}

header p {
  color: #aabbd4;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #111d33;
  border: 1px solid #263c60;
  border-radius: 15px;
  padding: 18px;
  margin: 12px 0;
}

button {
  background: #087cff;
  border: none;
  color: white;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
}

input {
  width: 100%;
  padding: 15px;
  background: #0a1425;
  border: 1px solid #29456e;
  color: white;
  border-radius: 10px;
  margin: 10px 0;
}

#messages {
  min-height: 180px;
  max-height: 350px;
  overflow-y: auto;
}

.message {
  padding: 12px;
  background: #1c3150;
  border-radius: 10px;
  margin: 10px 0;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.menu button {
  background: #142b4c;
  border: 1px solid #2862a0;
}

footer {
  text-align: center;
  color: #8295b1;
  padding: 25px;
}
</style>
</head>

<body>

<header>
<h1>ZAWI DIGITAL AI</h1>
<p>مساعدك الذكي في عالم التكنولوجيا</p>
</header>

<div class="container">

<div class="card">
<h2>مرحبا بك 👋</h2>
<p>أنا مساعد ZAWI DIGITAL، اختر الخدمة التي تريدها.</p>
</div>

<div class="card">
<h3>خدمات الذكاء الاصطناعي</h3>

<div class="menu">
<button onclick="show('chat')">🤖 المحادثة</button>
<button onclick="show('image')">🎨 إنشاء الصور</button>
<button onclick="show('study')">📚 الدراسة</button>
<button onclick="show('voice')">🎙️ الصوت</button>
</div>
</div>

<div class="card">
<h3 id="title">المحادثة الذكية</h3>

<div id="messages"></div>

<input id="userInput"
placeholder="اكتب رسالتك هنا...">

<button onclick="sendMessage()">إرسال الرسالة</button>
<button onclick="newChat()" style="background:#34445e">
محادثة جديدة
</button>
</div>

<div class="card">
<h3>📲 التطبيق</h3>
<p>قريباً: تنزيل نسخة Android APK.</p>
</div>

</div>

<footer>
ZAWI DIGITAL © 2026
</footer>

<script>

let currentMode = "chat";

function show(mode) {
  currentMode = mode;

  const titles = {
    chat: "المحادثة الذكية",
    image: "إنشاء الصور",
    study: "المساعد الدراسي",
    voice: "المساعد الصوتي"
  };

  document.getElementById("title").innerText =
    titles[mode];
}

function sendMessage() {

  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");

  if (!input.value.trim()) return;

  const text = input.value;

  messages.innerHTML +=
    `<div class="message">أنت: ${escapeHTML(text)}</div>`;

  let reply = "تم استلام طلبك. سيتم ربط الذكاء الاصطناعي الحقيقي في المرحلة القادمة.";

  if (currentMode === "image") {
    reply = "ميزة إنشاء الصور تحتاج إلى ربط خدمة توليد الصور.";
  }

  if (currentMode === "study") {
    reply = "المساعد الدراسي جاهز للربط بخدمة الذكاء الاصطناعي.";
  }

  if (currentMode === "voice") {
    reply = "يمكن إضافة التحدث الصوتي في المرحلة القادمة.";
  }

  messages.innerHTML +=
    `<div class="message">ZAWI AI: ${reply}</div>`;

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[c]);
}

function newChat() {
  document.getElementById("messages").innerHTML = "";
}

</script>

</body>
  </html>
